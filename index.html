<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07110c" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tejas Canvassing Store" />
    <meta name="application-name" content="Tejas Canvassing Store" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <title>Tejas Canvassing Store</title>
    <meta name="description" content="Tejas Canvassing B2B wholesale rice procurement and store operations platform connecting premium grains with growing businesses." />
    <meta property="og:title" content="Tejas Canvassing Store" />
    <meta property="og:description" content="Tejas Canvassing B2B wholesale rice procurement and store operations platform connecting premium grains with growing businesses." />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="app-bootstrap-loader" style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fafaf9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; user-select: none;">
        <style>
          @media (prefers-color-scheme: dark) {
            #app-bootstrap-loader { background-color: #07110c !important; color: #ffffff !important; }
            #app-bootstrap-loader .loader-box { background: rgba(12, 22, 17, 0.9) !important; border-color: rgba(245, 158, 11, 0.2) !important; box-shadow: 0 16px 40px rgba(0,0,0,0.5) !important; }
            #app-bootstrap-loader .loader-title { color: #ffffff !important; }
            #app-bootstrap-loader .loader-quote { color: #d1fae5 !important; }
            #app-bootstrap-loader .loader-track { background: rgba(255, 255, 255, 0.1) !important; }
          }
          @keyframes softPulse {
            0%, 100% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
          }
        </style>
        <div class="loader-box" style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 36px 28px; border-radius: 24px; background: #ffffff; border: 1px solid rgba(217, 119, 6, 0.2); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); max-width: 360px; width: 100%;">
          <!-- Center Logo -->
          <div style="width: 56px; height: 56px; border-radius: 16px; background: #fef3c7; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(217, 119, 6, 0.3); animation: softPulse 2.5s infinite ease-in-out;">
            <img src="/logo.png" alt="Tejas Canvassing" style="width: 42px; height: 42px; border-radius: 10px; object-fit: contain;" />
          </div>

          <!-- Title & Greeting / Quote -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <span style="font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #b45309;">
              TEJAS CANVASSING · EST. 2008
            </span>
            <span class="loader-title" style="font-size: 17px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; color: #0f172a; margin-top: 2px;">
              Annadata Sukhibhava
            </span>
            <span class="loader-quote" style="font-size: 12px; font-style: italic; color: #4b5563; line-height: 1.4; margin-top: 4px;">
              “From the fertile soils of Tungabhadra to your counter — purity in every grain.”
            </span>
          </div>

          <!-- Gentle, quiet subtle loading line -->
          <div class="loader-track" style="width: 80px; height: 3px; background: #f3f4f6; border-radius: 9999px; overflow: hidden; position: relative; margin-top: 8px;">
            <div style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #d97706; border-radius: 9999px; opacity: 0.75;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
